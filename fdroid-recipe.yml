AutoName: Control de Horas
Summary: App Android de control de horas para trabajo y practica profesional
Description: |
  App Android nativa para el registro preciso de horas de
  trabajo, practica profesional y actividades academicas.

  Incluye temporizador activo con proteccion anti-olvido,
  registro manual retroactivo, edicion de sesiones, dashboard
  de estadisticas, calendario mensual, exportacion CSV/PDF,
  modo offline con cola de sincronizacion, 6 colores de acento
  y modo oscuro/claro.

  No requiere Google Play Services.

